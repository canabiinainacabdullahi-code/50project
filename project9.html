<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANIMATED Landing</title>

   <style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&display=swap');
    body{
        font-family: "poppins", sans-serif;
        color: aliceblue;
        line-height: 1.6;
    
    }

    .hero{
        position: relative;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
    }

    .hero-vedio{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;

    }
    

    <!--overlay-->

    .overlay{
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.5);
        z-index: 0;
    }

    .hero-content{
        position: relative;
        z-index: 1;
    }

    .hero-content h1{
        font-size: 2rem;
        margin: 0;
        animation: fadeI 1.5s ease-in-out;
    }
    .hero-content p{
        font-size: 1.5rem;
        margin: 20px 0;
        animation: fadeI 1.5S ease-in-out;
    }

    .btn{
        background-color: #007bff;
        padding: 10PX 15PX;
        font-size: 1REM;
        text-decoration: none;
        border-radius: 10px;
        color: white;
        transition: background 0.3s ease;
        animation: fadeIn 2s ease-in-out;

    }


    .btn:hover{
        background-color: #262a2e;
    }




   </style>
</head>
<body>
    <!--hero section-->
    <section class="hero">
    <!--bacgroun vedio-->
    <video autoplay muted loop class="hero-vedio" >
        <source src="https://content.pexels.com/aigc-bundle/videos/4dbe8725-60f6-461a-9501-2f2dc528b190.mp4">
    </video>

    <!--overlay-->
    <div class="overlay"></div>
    <!--her-contect-->
    <div class="hero-content">
        <h1 class="animated-text"> Welcome to a world</h1>
        <p class="animated-text">scored the future of innovation and creativity.</p>
        <a href="#" class="btn">GET started</a>
    </div>
    </section> 
    

    
</body>
</html>
