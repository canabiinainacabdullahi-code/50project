<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: rgb(47, 43, 43);
        }


        .min{
            max-width: 400px;
            margin: 0 auto;
            



        }

        .min h1{
            color: rgb(185, 209, 231);
            margin: 15px 0;
            font-size: 3rem;
            text-align: center;

        }


        .min form input, select,button{
            width: 100%;
            margin: 10px 0;
            padding: 10px;
            border-radius: 10px;
            border: none;
        }

        button{
            background-color: rgb(243, 153, 69);
            color: aliceblue;
            animation: background 0.3s ease;
        }
        button:hover{
            background-color: rgb(91, 101, 101);
        }
    </style>
</head>
<body>

    
    <div class="min">
        <h1>My form</h1>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <input type="text" placeholder="password" required>
            <select>
                <option>Engilish</option>
                <option>biology</option>
                <option>Math</option>
                <option>Arabic</option>
            </select>

            <button>by Now</button>
           

        </form>

    </div>

    </section>
    
</body>
</html>
